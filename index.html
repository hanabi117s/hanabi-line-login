
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>華灯〜HANABI〜</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 15px;">
  <h2>華灯〜HANABI〜</h2>
  <p id="status">LINE認証を確認しています...</p>

  <script>
    async function start() {
      const status = document.getElementById('status');

      try {
        await liff.init({
          liffId: '2012319110-unAP6Rum'
        });

      
if (!liff.isLoggedIn()) {
  if (!liff.isInClient()) {
    status.textContent = 'LINEログイン中...';
    liff.login();
    return;
  }

  status.textContent =
    'LINEのログイン状態を取得できませんでした。';
  return;
}


status.textContent = '予約管理を開いています...';

const idToken = liff.getIDToken();
if (!idToken) {
  throw new Error('LINE認証情報を取得できません。');
}

const form = document.createElement('form');
form.method = 'POST';
form.action = 'https://script.google.com/macros/s/AKfycbyqNAeMqPdLPtFNzTxsBuP_N5H9-57lTyym2KXx7waihH0I1cfJSRRoHT3A4mwG4zaK/exec';
form.style.display = 'none';

const input = document.createElement('input');
input.type = 'hidden';
input.name = 'idToken';
input.value = idToken;

form.appendChild(input);
document.body.appendChild(form);
form.submit();


      } catch (error) {
        status.textContent =
          'エラー：' + error.message;
      }
    }

    start();
  </script>
</body>
</html>
